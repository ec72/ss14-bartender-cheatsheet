        </div>

        <div class="flex flex-wrap gap-1.5 text-xs">
          <button type="button" data-filter="all" class="filter-btn active px-2.5 py-1 rounded-lg font-medium bg-teal-500/15 text-teal-700 dark:text-nt-teal border border-teal-500/30">

            Multi-Step (<span id="countNested">0</span>)

            1-Step (<span id="countBase">0</span>)
          </button>
        </div>

        <!-- Drink List -->
        <div id="drinkList" class="max-h-[42vh] lg:max-h-[65vh] overflow-y-auto space-y-1 pr-1"></div>
      </div>
    </aside>

    <section class="lg:col-span-8 xl:col-span-9 flex flex-col gap-4">

    const LOCALE_ID_ALIASES = {
      "BudgetInsulsDrink": "budget-insuls",
      "IcedBeerAlt": "iced-beer"
    };

    const BASE_DISPENSER_DRINKS = new Set([
      "Vodka",
      "Cola",
      "Tea",
      "SodaWater"
    ]);

    let selectedDrink = "AlienBrainHemorrhage";
    let searchQuery = "";
    let activeFilter = "all";
    let expandedPaths = new Set();
    let pinnedOrders = [];
    let targetGlassSize = 30;

    function toKebabCase(id) {
      return id
        .replace(/([a-z0-9])([A-Z])/g, "$1-$2")
        .replace(/([A-Z]+)([A-Z][a-z])/g, "$1-$2")
        .toLowerCase();
    }

    function formatDisplayTitle(rawStr) {
      if (!rawStr) return "";
      return rawStr.charAt(0).toUpperCase() + rawStr.slice(1);
    }

    function getLocaleEntry(id) {
      if (!id) return null;
      const aliasKey = LOCALE_ID_ALIASES[id];
      if (aliasKey && LOCALE_MAP[aliasKey]) return LOCALE_MAP[aliasKey];

      const kebab = toKebabCase(id);
      if (LOCALE_MAP[kebab]) return LOCALE_MAP[kebab];

      const flat = id.toLowerCase();
      if (LOCALE_MAP[flat]) return LOCALE_MAP[flat];

      return null;
    }

    function getDisplayName(id) {
      const entry = getLocaleEntry(id);
      if (entry && entry.name) {
        return formatDisplayTitle(entry.name);
      }
      return id;
    }

    function getDrinkDescription(id) {
      const entry = getLocaleEntry(id);
      return entry && entry.desc ? entry.desc : "";
    }

    function formatUnitAmount(val) {
      const rounded = Math.round(val * 100) / 100;
      return String(rounded);
    }

    function getSpecialMethod(recipe) {
      if (!recipe || !recipe.method) return "";
      const m = recipe.method.trim();
      if (!m || m.toLowerCase() === "mix" || m.toLowerCase() === "no action") return "";
      return m;
    }

    function isCraftedDrink(name) {
      if (BASE_DISPENSER_DRINKS.has(name)) {
        return false;
      }
      return Object.prototype.hasOwnProperty.call(RECIPES, name);
    }

    function hasNestedSubDrinks(drinkName) {
      const recipe = RECIPES[drinkName];
      if (!recipe) return false;
      return recipe.ingredients.some(ing => isCraftedDrink(ing.name));
    }

    function getNestingDepth(drinkName, visited = new Set()) {
      if (visited.has(drinkName)) return 0;
      const recipe = RECIPES[drinkName];
      if (!recipe) return 0;
      const nextVisited = new Set(visited);
      nextVisited.add(drinkName);

      let maxChildDepth = 0;
      for (const ing of recipe.ingredients) {
        if (isCraftedDrink(ing.name)) {
          maxChildDepth = Math.max(maxChildDepth, 1 + getNestingDepth(ing.name, nextVisited));
        }
      }
      return maxChildDepth;
    }

    function collectAllBranchPaths(drinkName, prefix = "root", visited = new Set()) {
      const paths = [];
      if (visited.has(drinkName)) return paths;
      const recipe = RECIPES[drinkName];
      if (!recipe) return paths;

      const nextVisited = new Set(visited);
      nextVisited.add(drinkName);

      recipe.ingredients.forEach((ing, idx) => {
        if (isCraftedDrink(ing.name)) {
          const pathId = `${prefix}-${idx}-${ing.name}`;
          paths.push(pathId);
          paths.push(...collectAllBranchPaths(ing.name, pathId, nextVisited));
        }
      });
      return paths;
    }

    function flattenToBaseIngredients(drinkName, multiplier = 1, visited = new Set()) {
      const totals = {};
      const recipe = RECIPES[drinkName];
      if (!recipe || visited.has(drinkName)) {
        totals[drinkName] = (totals[drinkName] || 0) + multiplier;
        return totals;
      }

      const nextVisited = new Set(visited);
      nextVisited.add(drinkName);

      const totalParts = recipe.ingredients.reduce((sum, i) => sum + (i.catalyst ? 0 : i.amount), 0) || 1;

      for (const ing of recipe.ingredients) {
        if (ing.catalyst) {
          totals[ing.name] = Math.max(totals[ing.name] || 0, ing.amount);
          continue;
        }
        const scaledAmount = (ing.amount / totalParts) * multiplier;
        if (isCraftedDrink(ing.name)) {
          const subTotals = flattenToBaseIngredients(ing.name, scaledAmount, nextVisited);
          for (const [baseName, amt] of Object.entries(subTotals)) {
            totals[baseName] = (totals[baseName] || 0) + amt;
          }
        } else {
          totals[ing.name] = (totals[ing.name] || 0) + scaledAmount;
        }
      }
      return totals;
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const text = document.getElementById("toastMessage");
      text.textContent = msg;
      box.classList.remove("opacity-0", "translate-y-2");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add("opacity-0", "translate-y-2");
      }, 2600);
    }

    function copyText(text) {
      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        showToast(`Copied "${text}" to clipboard`);
      } catch (err) {
        showToast("Unable to copy text");
      }
      document.body.removeChild(tempInput);
    }

    function renderPinnedOrders() {
      const container = document.getElementById("pinnedOrdersList");
      if (pinnedOrders.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-400 italic">No active orders pinned — click "Pin Order" on any drink to track customer orders.</span>`;
        return;
      }

      container.innerHTML = pinnedOrders.map(drinkName => {
        const isActive = drinkName === selectedDrink;
        const displayName = getDisplayName(drinkName);
        return `
          <div class="inline-flex items-center rounded-lg border text-xs transition shrink-0 ${
            isActive
              ? "bg-teal-500/15 border-teal-500 text-teal-800 dark:text-nt-teal font-semibold"
              : "bg-slate-100 dark:bg-nt-card border-slate-300 dark:border-nt-border text-slate-700 dark:text-slate-300 hover:border-teal-500/60"
          }">
            <button type="button" onclick="selectDrink('${drinkName}')" class="px-2.5 py-1 flex items-center gap-1.5">
              <span>${displayName}</span>
            </button>
            <button type="button" onclick="togglePinOrder('${drinkName}')" title="Complete / Unpin Order" class="pr-2 pl-1 py-1 text-slate-400 hover:text-rose-500">
              ✕
            </button>
          </div>
        `;
      }).join("");
    }

    function renderDrinkList() {
      const listEl = document.getElementById("drinkList");
      const allNames = Object.keys(RECIPES).sort((a, b) => getDisplayName(a).localeCompare(getDisplayName(b)));

      const nestedCount = allNames.filter(n => hasNestedSubDrinks(n)).length;
      const baseCount = allNames.length - nestedCount;
      document.getElementById("countAll").textContent = allNames.length;
      document.getElementById("countNested").textContent = nestedCount;
      document.getElementById("countBase").textContent = baseCount;

      const q = searchQuery.trim().toLowerCase();
      const filtered = allNames.filter(name => {
        const isNested = hasNestedSubDrinks(name);
        if (activeFilter === "nested" && !isNested) return false;
        if (activeFilter === "base" && isNested) return false;

        if (!q) return true;
        const disp = getDisplayName(name).toLowerCase();
        if (name.toLowerCase().includes(q) || disp.includes(q)) return true;
        return RECIPES[name].ingredients.some(ing => {
          const ingDisp = getDisplayName(ing.name).toLowerCase();
          return ing.name.toLowerCase().includes(q) || ingDisp.includes(q);
        });
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">No matching drinks found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(name => {
        const isSelected = name === selectedDrink;
        const isNested = hasNestedSubDrinks(name);
        const depth = isNested ? getNestingDepth(name) : 0;
        const displayName = getDisplayName(name);
        const showProtoSub = displayName.toLowerCase().replace(/[^a-z0-9]/g, "") !== name.toLowerCase();

        return `
          <button
            type="button"
            onclick="selectDrink('${name}')"
            class="w-full text-left px-3 py-2 rounded-xl text-sm flex items-center justify-between gap-2 transition ${
              isSelected
                ? "bg-teal-500/15 text-teal-800 dark:text-nt-teal border border-teal-500/40 font-semibold"
                : "hover:bg-slate-100 dark:hover:bg-nt-card text-slate-700 dark:text-slate-300 border border-transparent"
            }"
          >
            <div class="min-w-0">
              <div class="truncate">${displayName}</div>
              ${showProtoSub ? `<div class="text-[10px] font-mono text-slate-400 dark:text-slate-500 truncate">${name}</div>` : ""}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${isNested ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-700 dark:text-nt-amber border border-amber-500/30">${depth}x</span>` : ""}
            </div>
          </button>
        `;
      }).join("");
    }

    function renderIngredientTree(drinkName, prefix = "root", depth = 0, visited = new Set()) {
      const recipe = RECIPES[drinkName];
      if (!recipe) return "";

      if (visited.has(drinkName)) {
        return `<div class="text-xs text-rose-400 font-mono pl-3">↻ Circular reference: ${drinkName}</div>`;
      }

      const nextVisited = new Set(visited);
      nextVisited.add(drinkName);

      return `
        <ul class="space-y-2 ${depth > 0 ? "mt-2 pl-4 tree-branch" : ""}">
          ${recipe.ingredients.map((ing, idx) => {
            const isSubDrink = isCraftedDrink(ing.name);
            const pathId = `${prefix}-${idx}-${ing.name}`;
            const isExpanded = expandedPaths.has(pathId);
            const subRecipe = isSubDrink ? RECIPES[ing.name] : null;
            const subSpecialMethod = isSubDrink ? getSpecialMethod(subRecipe) : "";
            const displayIngName = getDisplayName(ing.name);
            const showProtoId = displayIngName.toLowerCase().replace(/[^a-z0-9]/g, "") !== ing.name.toLowerCase();

            return `
              <li class="rounded-xl transition ${
                isSubDrink
                  ? "bg-slate-50/90 dark:bg-nt-card/90 border border-slate-200/90 dark:border-nt-border p-3"
                  : "px-3 py-2 rounded-lg bg-slate-50/50 dark:bg-nt-card/40 border border-transparent"
              }">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center justify-center min-w-[2.2rem] px-2 py-0.5 rounded-md font-mono font-bold text-sm ${
                      isSubDrink
                        ? "bg-amber-500/15 text-amber-700 dark:text-nt-amber border border-amber-500/30"
                        : "bg-slate-200/80 dark:bg-slate-800 text-slate-800 dark:text-slate-200"
                    }">
                      ${formatUnitAmount(ing.amount)}
                    </span>

                    <span class="font-semibold text-base ${
                      isSubDrink
                        ? "text-teal-700 dark:text-nt-teal"
                        : "text-slate-800 dark:text-slate-100"
                    }">
                      ${displayIngName}
                    </span>

                    ${
                      showProtoId
                        ? `<span class="text-xs font-mono text-slate-400 dark:text-slate-500">(${ing.name})</span>`
                        : ""
                    }

                    ${
                      ing.catalyst
                        ? `<span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-purple-500/15 text-purple-700 dark:text-purple-300 border border-purple-500/30">
                            Catalyst
                          </span>`
                        : ""
                    }

                    ${
                      isSubDrink && subSpecialMethod
                        ? `<span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-cyan-500/15 text-cyan-700 dark:text-nt-cyan border border-cyan-500/30">
                            ${subSpecialMethod}
                          </span>`
                        : !isSubDrink && !ing.catalyst
                          ? `<span class="text-[11px] font-mono text-slate-400 dark:text-slate-500">Base</span>`
                          : ""
                    }
                  </div>

                  ${
                    isSubDrink
                      ? `
                        <div class="flex items-center gap-1.5">
                          <button
                            type="button"
                            onclick="toggleBranch('${pathId}')"
                            class="px-2.5 py-1 rounded-lg text-xs font-mono font-semibold transition flex items-center gap-1.5 shadow-2xs ${
                              isExpanded
                                ? "bg-teal-600 text-white"
                                : "bg-teal-500/15 hover:bg-teal-500/25 text-teal-700 dark:text-nt-teal border border-teal-500/30"
                            }"
                          >
                            <span>${isExpanded ? "▼ Hide Recipe" : "▶ + Sub-Recipe"}</span>
                          </button>
                          <button
                            type="button"
                            onclick="selectDrink('${ing.name}')"
                            title="Jump directly to ${displayIngName}"
                            class="p-1.5 rounded-lg text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200/60 dark:hover:bg-slate-800 transition"
                          >
                            ↗
                          </button>
                        </div>
                      `
                      : ""
                  }
                </div>

                ${
                  isSubDrink && isExpanded
                    ? `
                      <div class="mt-2.5 pt-2.5 border-t border-slate-200/80 dark:border-nt-border/80">
                        <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono text-slate-500 dark:text-slate-400 mb-1">
                          <span>HOW TO MAKE <strong class="text-slate-700 dark:text-slate-200">${displayIngName}</strong>${subSpecialMethod ? ` (${subSpecialMethod})` : ""}:</span>
                          <span>Ratio parts: ${subRecipe.ingredients.map(i => `${formatUnitAmount(i.amount)} ${getDisplayName(i.name)}`).join(" + ")}</span>
                        </div>
                        ${renderIngredientTree(ing.name, pathId, depth + 1, nextVisited)}
                      </div>
                    `
                    : ""
                }
              </li>
            `;
          }).join("")}
        </ul>
      `;
    }

    function renderRecipeViewer() {
      const viewer = document.getElementById("recipeViewer");
      const recipe = RECIPES[selectedDrink];

      if (!recipe) {
        viewer.innerHTML = `<div class="p-8 text-center text-slate-400">Select a drink from the index to inspect its recipe.</div>`;
        return;
      }

      const displayName = getDisplayName(selectedDrink);
      const description = getDrinkDescription(selectedDrink);
      const isPinned = pinnedOrders.includes(selectedDrink);
      const allBranchPaths = collectAllBranchPaths(selectedDrink);
      const hasSubRecipes = allBranchPaths.length > 0;
      const allExpanded = hasSubRecipes && allBranchPaths.every(p => expandedPaths.has(p));
      const specialMethod = getSpecialMethod(recipe);

      const baseBatchTotal = recipe.ingredients.reduce((s, i) => s + (i.catalyst ? 0 : i.amount), 0) || 1;
      const effectiveMultiplier = targetGlassSize === 0 ? baseBatchTotal : targetGlassSize;
      const rawTotals = flattenToBaseIngredients(selectedDrink, effectiveMultiplier);
      const baseEntries = Object.entries(rawTotals).sort((a, b) => b[1] - a[1]);

      const usedInDrinks = Object.keys(RECIPES).filter(dName =>
        RECIPES[dName].ingredients.some(i => i.name === selectedDrink)
      );

      viewer.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-4 pb-5 border-b border-slate-200 dark:border-nt-border">
          <div class="max-w-2xl">
            <div class="flex flex-wrap items-center gap-2.5">
              <h2 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                ${displayName}
              </h2>
              <span class="px-2 py-0.5 rounded-md text-xs font-mono bg-slate-100 dark:bg-nt-card text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-nt-border">
                ${selectedDrink}
              </span>
              <button
                type="button"
                onclick="copyText('${displayName}')"
                title="Copy in-game drink name"
                class="px-2 py-1 rounded-md text-xs font-mono bg-slate-100 dark:bg-nt-card hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-nt-border transition"
              >
                Copy Name
              </button>
            </div>

            ${
              description
                ? `<p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 italic mt-1.5">"${description}"</p>`
                : ""
            }

            <div class="flex flex-wrap items-center gap-2 mt-2.5 text-xs font-mono">
              ${
                specialMethod
                  ? `<span class="px-2.5 py-0.5 rounded-md bg-cyan-500/15 text-cyan-700 dark:text-nt-cyan border border-cyan-500/30 font-semibold">
                      ${specialMethod}
                    </span>`
                  : ""
              }
              <span class="px-2.5 py-0.5 rounded-md bg-slate-100 dark:bg-nt-card text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-nt-border">
                Input: ${formatUnitAmount(baseBatchTotal)}u → Output: ${recipe.yield || baseBatchTotal}u
              </span>
              ${
                hasSubRecipes
                  ? `<span class="px-2.5 py-0.5 rounded-md bg-amber-500/15 text-amber-700 dark:text-nt-amber border border-amber-500/30">
                      Nested Depth: ${getNestingDepth(selectedDrink)} Tier${getNestingDepth(selectedDrink) > 1 ? "s" : ""}
                    </span>`
                  : ""
              }
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            ${
              hasSubRecipes
                ? `
                  <button
                    type="button"
                    onclick="toggleExpandAll()"
                    class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 border ${
                      allExpanded
                        ? "bg-slate-200 dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-200"
                        : "bg-teal-600 hover:bg-teal-500 border-teal-500 text-white shadow-sm"
                    }"
                  >
                    <span>${allExpanded ? "▲ Collapse All Sub-Recipes" : "▼ Expand All Sub-Recipes"}</span>
                  </button>
                `
                : ""
            }

            <button
              type="button"
              onclick="togglePinOrder('${selectedDrink}')"
              class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition flex items-center gap-1.5 ${
                isPinned
                  ? "bg-amber-500/15 border-amber-500/40 text-amber-700 dark:text-nt-amber"
                  : "bg-white dark:bg-nt-card border-slate-300 dark:border-nt-border hover:border-amber-500 text-slate-700 dark:text-slate-200"
              }"
            >
              <span>${isPinned ? "📌 Pinned in Queue" : "📌 Pin Order"}</span>
            </button>
          </div>
        </div>

        <div class="mt-5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold">
              Recipe Ingredients & Inline Sub-Recipes
            </h3>
            ${
              hasSubRecipes
                ? `<span class="text-xs text-teal-600 dark:text-nt-teal font-medium">Click any highlighted sub-drink to unfold</span>`
                : ""
            }
          </div>

          ${renderIngredientTree(selectedDrink)}
        </div>

        <div class="mt-6 pt-5 border-t border-slate-200 dark:border-nt-border">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h3 class="text-xs font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold">
                Flattened Raw Dispenser Ingredients (Total Ratio)
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                Exact base reagents needed if mixing from scratch:
              </p>
            </div>

            <div class="inline-flex rounded-lg bg-slate-100 dark:bg-nt-card p-1 border border-slate-200 dark:border-nt-border text-xs font-mono">
              ${[
                { val: 0, label: "1x (Base)" },
                { val: 30, label: "30u Glass" },
                { val: 60, label: "60u Large" }
              ].map(opt => `
                <button
                  type="button"
                  onclick="setGlassSize(${opt.val})"
                  class="px-2.5 py-1 rounded-md transition ${
                    targetGlassSize === opt.val
                      ? "bg-white dark:bg-slate-700 text-teal-700 dark:text-nt-teal font-bold shadow-2xs"
                      : "text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                  }"
                >
                  ${opt.label}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
            ${baseEntries.map(([reagent, amount]) => {
              const formattedAmt = formatUnitAmount(amount);
              const dispReagent = getDisplayName(reagent);
              return `
                <div class="px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-nt-card border border-slate-200/80 dark:border-nt-border flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-xs sm:text-sm font-medium truncate text-slate-700 dark:text-slate-200" title="${dispReagent} (${reagent})">
                      ${dispReagent}
                    </div>
                    ${dispReagent.toLowerCase().replace(/[^a-z0-9]/g, "") !== reagent.toLowerCase() ? `<div class="text-[10px] font-mono text-slate-400 truncate">${reagent}</div>` : ""}
                  </div>
                  <span class="font-mono text-xs sm:text-sm font-bold text-teal-700 dark:text-nt-teal shrink-0">
                    ${formattedAmt}u
                  </span>
                </div>
              `;
            }).join("")}
          </div>
        </div>

        ${
          usedInDrinks.length > 0
            ? `
              <div class="mt-6 pt-4 border-t border-slate-200 dark:border-nt-border">
                <h3 class="text-xs font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold mb-2.5">
                  Used As An Ingredient In:
                </h3>
                <div class="flex flex-wrap gap-2">
                  ${usedInDrinks.map(parentDrink => `
                    <button
                      type="button"
                      onclick="selectDrink('${parentDrink}')"
                      class="px-3 py-1.5 rounded-lg text-xs bg-slate-100 dark:bg-nt-card hover:bg-teal-500/15 text-slate-700 dark:text-slate-200 hover:text-teal-700 dark:hover:text-nt-teal border border-slate-200 dark:border-nt-border transition"
                    >
                      ${getDisplayName(parentDrink)} →
                    </button>
                  `).join("")}
                </div>
              </div>
            `
            : ""
        }
      `;
    }

    function renderAll() {
      renderPinnedOrders();
      renderDrinkList();
      renderRecipeViewer();
    }

    window.selectDrink = function(drinkName) {
      if (!RECIPES[drinkName]) return;
      selectedDrink = drinkName;
      expandedPaths.clear();
      const firstLevel = RECIPES[drinkName].ingredients
        .map((ing, idx) => (isCraftedDrink(ing.name) ? `root-${idx}-${ing.name}` : null))
        .filter(Boolean);
      firstLevel.forEach(p => expandedPaths.add(p));
      renderAll();
    };

    window.toggleBranch = function(pathId) {
      if (expandedPaths.has(pathId)) {
        expandedPaths.delete(pathId);
      } else {
        expandedPaths.add(pathId);
      }
      renderRecipeViewer();
    };

    window.toggleExpandAll = function() {
      const allPaths = collectAllBranchPaths(selectedDrink);
      const allExpanded = allPaths.every(p => expandedPaths.has(p));
      if (allExpanded) {
        expandedPaths.clear();
      } else {
        allPaths.forEach(p => expandedPaths.add(p));
      }
      renderRecipeViewer();
    };

    window.togglePinOrder = function(drinkName) {
      const idx = pinnedOrders.indexOf(drinkName);
      if (idx >= 0) {
        pinnedOrders.splice(idx, 1);
      } else {
        pinnedOrders.push(drinkName);
      }
      renderPinnedOrders();
      renderRecipeViewer();
    };

    window.setGlassSize = function(size) {
      targetGlassSize = size;
      renderRecipeViewer();
    };

    window.copyText = copyText;

    document.addEventListener("DOMContentLoaded", () => {
      expandedPaths.add("root-0-IrishCream");
      renderAll();

      const searchInput = document.getElementById("searchInput");
      const btnClearSearch = document.getElementById("btnClearSearch");

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        btnClearSearch.classList.toggle("hidden", !searchQuery);
        renderDrinkList();
      });

      btnClearSearch.addEventListener("click", () => {
        searchQuery = "";
        searchInput.value = "";
        btnClearSearch.classList.add("hidden");
        renderDrinkList();
      });

      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeFilter = btn.dataset.filter;
          document.querySelectorAll(".filter-btn").forEach(b => {
            b.classList.remove("bg-teal-500/15", "text-teal-700", "dark:text-nt-teal", "border-teal-500/30");
            b.classList.add("bg-slate-100", "dark:bg-nt-card", "text-slate-600", "dark:text-slate-400", "border-transparent");
          });
          btn.classList.remove("bg-slate-100", "dark:bg-nt-card", "text-slate-600", "dark:text-slate-400", "border-transparent");
          btn.classList.add("bg-teal-500/15", "text-teal-700", "dark:text-nt-teal", "border-teal-500/30");
          renderDrinkList();
        });
      });

      const btnThemeToggle = document.getElementById("btnThemeToggle");
      const themeIcon = document.getElementById("themeIcon");
      btnThemeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        themeIcon.textContent = isDark ? "☀️" : "🌙";
      });
    });
  </script>
</body>
</html>
